[build]
  publish = "."

# ------------------------------------------------------------------
# Cabeceras de seguridad (aplican a todo el sitio).
#
# Content-Security-Policy: solo permite cargar recursos desde este
# mismo sitio ("'self'"), Google Fonts (hoja de estilos + tipografías)
# y el iframe de Google Maps de la página de contacto. No hay scripts
# inline activos en el sitio, así que script-src queda estricto (sin
# 'unsafe-inline' ni 'unsafe-eval'). style-src sí necesita
# 'unsafe-inline' porque varias páginas usan atributos style="" —
# el riesgo de eso es bajo (no permite ejecutar JavaScript).
#
# Google Tag Manager (GTM-MXD63XJL, activado 2026-09-16 en
# assets/js/main.js) agregado a script-src/img-src/connect-src abajo.
# Solo se carga tras consentimiento explícito de la persona (ver
# banner de cookies) — Consent Mode v2 (analytics_storage/ad_storage
# denegados por defecto).
# ------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=(), browsing-topics=()"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com; frame-src https://www.google.com; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# El README.md es documentación interna para desarrollo (no para
# visitantes del sitio) — existe en el repo pero no debe quedar
# público en la URL en vivo.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
